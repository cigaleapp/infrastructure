name: Build and publish dev deployments server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-deployments-server-image.yml

env:
  REGISTRY: data-terra.rg.ai.meso.umontpellier.fr
  IMAGE_NAME: default/terraforma-biodimedia/dev-deployments-server

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Get docker creds from service account json file
        env:
          SA_JSON: ${{ secrets.HF_SERVICE_ACCOUNT }}
        run: |
          echo "DOCKER_USERNAME=$(jq -r '.client_id' <<< "$SA_JSON")" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=$(jq -r '.client_secret' <<< "$SA_JSON")" >> $GITHUB_ENV


      - name: Log in to registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Create dockerfile
        run: |
          cat > Dockerfile.caddy <<'EOF'
            FROM caddy:2.10.2-builder AS builder
            RUN xcaddy build --with github.com/sagikazarmark/caddy-fs-s3@v0.12.0
            FROM caddy:2.10.2
            COPY --from=builder /usr/bin/caddy /usr/bin/caddy
          EOF

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ./Dockerfile.caddy
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
