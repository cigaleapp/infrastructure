name: Build and publish dev deployments server image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/dev-deployments-server-image.yml
      - .github/actions/build-push-image/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          service: dev-deployments-server
          service-account-json: ${{ secrets.HF_SERVICE_ACCOUNT }}
          source: inline
          dockerfile: Dockerfile.caddy
          dockerfile-content: |
            FROM caddy:2.10.2-builder AS builder
            RUN xcaddy build --with github.com/sagikazarmark/caddy-fs-s3@v0.12.0
            FROM caddy:2.10.2
            COPY --from=builder /usr/bin/caddy /usr/bin/caddy
