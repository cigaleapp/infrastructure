name: Terraform

on:
  push:
    paths:
      - '**/*.tf'
      - .terraform.lock.hcl
      - .github/workflows/terraform.yml
  workflow_dispatch:
    inputs:
      operation:
        description: 'What to do: plan (shows the planned changes) or apply (applies the changes)'
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply

env:
  OPERATION: ${{ github.event_name == 'push' && 'plan' || github.event.inputs.operation }}

jobs:
  operation:
    runs-on: ubuntu-latest

    name: ${{ github.event_name == 'push' && 'Plan' || github.event.inputs.operation == 'plan' && 'Plan' || 'Apply' }}

    # S3 backend credentials for the remote state (see `bootstrap/`).
    env:
      AWS_ENDPOINT_URL: ${{ secrets.TF_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
      AWS_REGION: ${{ secrets.TF_S3_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Set up hfctl
        uses: nudibranches-tech/setup-hfctl@v1
        with:
          service-account: ${{ secrets.HF_SERVICE_ACCOUNT }}
          console-url: https://ai.meso.umontpellier.fr

      - name: Setup hyperfluid terraform provider
        run: |
          terraform init
          hfctl tf auth

      - name: Setup terraform.tfvars
        run: |
          cp terraform.tfvars.example terraform.tfvars

      - if: env.OPERATION == 'plan'
        name: Terraform Plan
        run: terraform plan -input=false

      - if: env.OPERATION == 'apply'
        name: Terraform Apply
        run: terraform apply -auto-approve -input=false
