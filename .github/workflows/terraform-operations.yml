name: Terraform

on:
  workflow_call:
    inputs:
      operation:
        description: 'What to do: plan (shows the planned changes) or apply (applies the changes)'
        type: string
        required: true

    secrets:
      TF_S3_ENDPOINT:
        description: 'S3 endpoint URL for the remote state'
      TF_S3_ACCESS_KEY:
        description: 'S3 access key for the remote state'
      TF_S3_SECRET_KEY:
        description: 'S3 secret key for the remote state'
      TF_S3_DEFAULT_REGION:
        description: 'S3 default region for the remote state'

jobs:
  operation:
    runs-on: ubuntu-latest

    name: Run terraform ${{ inputs.operation }}

    # S3 backend credentials for the remote state (see `bootstrap/`).
    env:
      AWS_ENDPOINT_URL: ${{ secrets.TF_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_S3_SECRET_KEY }}
      AWS_REGION: ${{ secrets.TF_S3_DEFAULT_REGION }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.6

      - name: Set up hfctl
        uses: nudibranches-tech/setup-hfctl@v1
        with:
          service-account: ${{ secrets.HF_SERVICE_ACCOUNT }}
          console-url: https://ai.meso.umontpellier.fr

      - name: Setup hyperfluid terraform provider
        run: |
          terraform init
          hfctl tf auth

      - name: Setup terraform.tfvars
        run: |
          cp terraform.tfvars.example terraform.tfvars

      - if: inputs.operation == 'plan'
        name: Terraform Plan
        run: terraform plan -input=false

      - if: inputs.operation == 'apply'
        name: Terraform Apply
        run: terraform apply -auto-approve -input=false
