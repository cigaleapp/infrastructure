name: Build and publish CIGALE image

on:
  workflow_dispatch: 
  schedule:
    - cron: '0 3 * * *' # every day at 3am UTC
  push: 
    branches: [main]
    paths:
      - .github/workflows/cigale-image.yml
      - .github/actions/build-push-image/**

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions: 
      contents: read
      packages: write

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and push image
        uses: ./.github/actions/build-push-image
        with:
          service: cigale-app
          restart: cigale-app
          service-account-json: ${{ secrets.HF_SERVICE_ACCOUNT }}
          source: repo
          repository: cigaleapp/cigale 
