name: Build EcoSignal Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ecosignal-images.yml
      - .github/actions/build-push-image/**

jobs:
  build-images:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: backend
          - service: frontend
          - service: geo_db

    name: Build ${{ matrix.service }} image

    steps:
      - name: Checkout infrastructure repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build and push ${{ matrix.service }} image
        uses: ./.github/actions/build-push-image
        with:
          service: ecosignal-${{ matrix.service }}
          service-account-json: ${{ secrets.HF_SERVICE_ACCOUNT }}
          source: repo
          repository: cigaleapp/eco-signal
          ref: s3
          context: ${{ matrix.service }}

      - name: Setup hfctl
        uses: nudibranches-tech/setup-hfctl@v1
        with:
          service-account: ${{ secrets.HF_SERVICE_ACCOUNT }}
          console-url: https://ai.meso.umontpellier.fr

      - if: matrix.service != 'geo_db'
        name: Restart ${{ matrix.service }} container
        run: |
          hfctl config set env biodimedia
          hfctl apps restart ecosignal-${{ matrix.service }}
