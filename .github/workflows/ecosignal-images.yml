name: Build EcoSignal Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ecosignal-images.yml
      - .github/actions/build-push-image/**

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend
          - service: frontend

    name: Build ${{ matrix.service }} image

    steps:
      - name: Build and push ${{ matrix.service }} image
        uses: ./.github/actions/build-push-image
        with:
          service: ecosignal-${{ matrix.service }}
          service-account-json: ${{ secrets.HF_SERVICE_ACCOUNT }}
          source: repo
          repository: cigaleapp/eco-signal
          context: ./${{ matrix.service }}
