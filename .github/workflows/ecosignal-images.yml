name: Build EcoSignal Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ecosignal-images.yml

jobs:
  build-images:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - service: backend
          - service: frontend

    name: Build ${{ matrix.service }} image

    env:
      REGISTRY: data-terra.rg.ai.meso.umontpellier.fr
      IMAGE_PREFIX: default/terraforma-biodimedia/ecosignal

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Get docker creds from service account json file
        env:
          SA_JSON: ${{ secrets.HF_SERVICE_ACCOUNT }}
        run: |
          echo "DOCKER_USERNAME=$(jq -r '.client_id' <<< "$SA_JSON")" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=$(jq -r '.client_secret' <<< "$SA_JSON")" >> $GITHUB_ENV

      - name: Log in to registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}

      - name: Checkout LiuDilongNJ/eco-signal
        uses: actions/checkout@v3
        with:
          repository: LiuDilongNJ/eco-signal

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}


      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
