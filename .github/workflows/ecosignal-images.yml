name: Build EcoSignal Images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/ecosignal-images.yml

jobs:
  build-images:
    name: Build EcoSignal images
    runs-on: ubuntu-latest

    env:
      REGISTRY: data-terra.rg.ai.meso.umontpellier.fr
      IMAGE_PREFIX: default/terraforma-biodimedia/ecosignal

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
      - name: Get docker creds from service account json file
        env:
          SA_JSON: ${{ secrets.HF_SERVICE_ACCOUNT }}
        run: |
          echo "DOCKER_USERNAME=$(jq -r '.client_id' <<< "$SA_JSON")" >> $GITHUB_ENV
          echo "DOCKER_PASSWORD=$(jq -r '.client_secret' <<< "$SA_JSON")" >> $GITHUB_ENV
      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_PASSWORD }}
      - name: Checkout LiuDilongNJ/eco-signal
        uses: actions/checkout@v3
        with:
          repository: LiuDilongNJ/eco-signal

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend:latest

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend:latest
